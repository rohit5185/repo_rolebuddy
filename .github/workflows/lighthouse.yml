# Lighthouse PWA/SEO audits and Playwright + axe accessibility checks on the built frontend.

name: Lighthouse and accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  FRONTEND_PORT: "3000"
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  LHCI_BASE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lighthouse-and-a11y:
    name: Lighthouse PWA/SEO + axe a11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Prepare backend stub for file dependency"
        working-directory: .
        run: |
          mkdir -p backend
          printf '%s\n' '{"name":"rolebuddy-backend","version":"1.0.0","private":true}' > backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}

      - name: Start frontend server
        run: |
          npm run start:standalone > ../frontend-server.log 2>&1 &
          echo $! > ../frontend-server.pid
        env:
          PORT: ${{ env.FRONTEND_PORT }}
          HOSTNAME: 127.0.0.1

      - name: Wait for frontend
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/login" > /dev/null; then
              echo "Frontend ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "--- frontend log ---"
          cat frontend-server.log || true
          exit 1

      - name: Run Lighthouse CI (PWA >= 80, SEO >= 80)
        run: npm run lighthouse:ci
        env:
          LHCI_BASE_URL: ${{ env.LHCI_BASE_URL }}

      - name: Run Playwright accessibility tests
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          CI: "true"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/lighthouse-reports
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn

      - name: Stop frontend server
        if: always()
        working-directory: .
        run: |
          if [ -f frontend-server.pid ]; then
            kill "$(cat frontend-server.pid)" 2>/dev/null || true
          fi
