# Continuous integration for RoleBuddy (monorepo: Next.js frontend + Express backend).
# Runs on every pull request and push to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  JWT_SECRET: ci-jwt-secret-do-not-use-in-production-32chars
  MONGO_URI: mongodb://localhost:27017/rolebuddy_ci
  NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Prepare backend stub for file: dependency"
        run: |
          mkdir -p ../backend
          printf '%s\n' '{"name":"rolebuddy-backend","version":"1.0.0","private":true}' > ../backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
          NEXT_TELEMETRY_DISABLED: "1"

  backend-unit:
    name: Backend unit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Activity logic smoke (no server)
        run: npm run activity:smoke

  integration:
    name: API integration (backend smokes + frontend client)
    runs-on: ubuntu-latest
    needs: [backend-unit]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Start API server
        working-directory: backend
        run: |
          npm start > ../backend-server.log 2>&1 &
          echo $! > ../backend-server.pid
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: ${{ env.MONGO_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          CLIENT_ORIGIN: http://localhost:3000
          FRONTEND_URL: http://localhost:3000

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health > /dev/null; then
              echo "Backend healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "--- backend log ---"
          cat backend-server.log || true
          exit 1

      - name: Run core API smoke tests
        working-directory: backend
        run: npm run ci:integration

      - name: "Prepare backend stub for frontend file dependency"
        run: |
          mkdir -p backend
          printf '%s\n' '{"name":"rolebuddy-backend","version":"1.0.0","private":true}' > backend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend auth API client check
        working-directory: frontend
        run: npm run auth:check
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}

      - name: Stop API server
        if: always()
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create compose .env
        run: |
          cat > .env <<'EOF'
          JWT_SECRET=ci-docker-build-secret-not-for-production-use
          CLIENT_ORIGIN=http://localhost:3000
          FRONTEND_URL=http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build stack images
        run: docker compose build
