# Build and publish production Docker images to GitHub Container Registry (GHCR).
# Runs on pushes to main and on version tags (v*.*.*).
#
# Before deploying the frontend image, set repository variable:
#   Settings → Secrets and variables → Actions → Variables
#   NEXT_PUBLIC_API_BASE_URL = https://your-api.example.com/api

name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "v*.*.*-*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rolebuddy-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: rolebuddy-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            api_build_arg: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.api_build_arg && format('NEXT_PUBLIC_API_BASE_URL={0}', vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:5000/api') || '' }}
